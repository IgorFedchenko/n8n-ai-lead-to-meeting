[project]
name = "lead-to-meeting"
version = "0.1.0"
description = "Durable adapters for the n8n lead-to-meeting reference workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "respx==0.22.0", "ruff==0.17.0", "mypy==1.19.1",
        "pip-audit==2.10.1", "bandit==1.9.3", "detect-secrets==1.5.0", "pre-commit==4.5.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: real PostgreSQL process and wire contracts"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app", "evals"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
