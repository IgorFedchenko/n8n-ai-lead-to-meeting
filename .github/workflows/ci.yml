name: Verify reference implementation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: ruff check app tests scripts evals
      - run: ruff format --check app tests scripts evals
      - run: mypy app evals
      - run: bandit -r app evals -q
      - run: python scripts/audit_dependencies.py
      - run: python scripts/scan_secrets.py
      - name: Security feature availability
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PYAVAIL'
          import json, os
          from pathlib import Path
          private = os.environ['REPOSITORY_PRIVATE'] == 'true'
          report = {'CodeQL': 'SKIPPED_UNAVAILABLE' if private else 'SEPARATE_WORKFLOW',
                    'native_private_secret_scanning': 'SKIPPED_UNAVAILABLE' if private else 'NOT_VERIFIED',
                    'reason': 'No paid private entitlement activated', 'free_scans': ['Bandit', 'detect-secrets', 'pip-audit']}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/security-availability.json').write_text(json.dumps(report))
          print(json.dumps(report))
          PYAVAIL
      - run: pytest -q -m "not postgres" --junitxml=artifacts/tests.xml
      - run: python -m evals.run --offline --output artifacts/evals.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fast-checks
          path: |
            artifacts/dependency-audit/
            artifacts/tests.xml
            artifacts/evals.json
            artifacts/security-availability.json
      - run: python scripts/generate_workflows.py && git diff --exit-code workflows
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: contracts
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U contract -d contracts" --health-interval 3s --health-retries 30
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://contract:synthetic-ci-only@localhost:5432/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: pytest -q -m postgres --junitxml=artifacts/postgres.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-contracts
          path: artifacts/postgres.xml
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/demo.sh
      - run: python3 scripts/verify_demo.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_demo.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: ./scripts/encode_demo.sh artifacts/video/demo.webm
      - run: docker compose --profile observability up -d phoenix
      - run: python scripts/verify_phoenix.py
      - name: Container diagnostics
        if: failure()
        run: |
          python3 scripts/diagnose.py
          docker compose logs --tail=60 app mock bootstrap n8n inbox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance
          path: |
            artifacts/acceptance.json
            artifacts/phoenix.json
            artifacts/video/
            docs/images/
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile observability down -v
