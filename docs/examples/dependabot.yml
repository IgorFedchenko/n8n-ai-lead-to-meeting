# Inactive example only: this path does not configure Dependabot.
# Public-repository opt-in requires explicit owner approval before copying to .github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
