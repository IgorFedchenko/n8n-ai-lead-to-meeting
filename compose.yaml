name: lead-to-meeting
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: demo
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/demo.sh first}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run ./scripts/demo.sh first}
  SERVICE_KEY: ${SERVICE_KEY}
  WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
  INTEGRATION_MODE: ${INTEGRATION_MODE:-mock}
  # CLI publication uses the supported startup activation manager.
  N8N_USE_WORKFLOW_PUBLICATION_SERVICE: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_SECURE_COOKIE: "false"
  EXECUTIONS_DATA_SAVE_ON_ERROR: none
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"
  GENERIC_TIMEZONE: UTC
  TZ: UTC

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d n8n"]
      interval: 3s
      retries: 30
    mem_limit: 512m

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://demo:${POSTGRES_PASSWORD}@postgres/n8n
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    ports: ["127.0.0.1:${DEMO_PORT:-8088}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mock: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30
    mem_limit: 512m

  mock:
    build: .
    command: [uvicorn, app.mock:app, --host, 0.0.0.0, --port, "8001", --no-access-log]
    environment:
      DATABASE_URL: postgresql+psycopg://demo:${POSTGRES_PASSWORD}@postgres/n8n
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      retries: 30
    mem_limit: 256m

  inbox:
    image: greenmail/standalone:2.1.7
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=demo:demo@example.test
      JAVA_OPTS: -Xmx128m
    mem_limit: 256m

  bootstrap:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    entrypoint: [/bin/sh, /bootstrap.sh]
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
      app: {condition: service_healthy}
    mem_limit: 768m

  phoenix:
    image: arizephoenix/phoenix:20.22.0
    profiles: [observability]
    ports: ["127.0.0.1:6006:6006"]
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenix_data:/data]
    mem_limit: 1024m

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    environment: *n8n-env
    ports: ["127.0.0.1:${N8N_PORT:-5679}:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    mem_limit: 1024m

volumes:
  pg_data:
  n8n_data:
  phoenix_data:
